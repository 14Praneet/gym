<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Healthy Wealthy Gym</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2>Register</h2>
            <div id="error" class="error" style="display: none;"></div>
            <div id="success" class="success" style="display: none;"></div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required onkeyup="checkPassword()">
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Confirm Password:</label>
                    <input type="password" id="confirm_password" name="confirm_password" required onkeyup="checkPassword()">
                    <div id="passwordMatch" class="password-match"></div>
                </div>
                
                <div class="form-group">
                    <label for="full_name">Full Name:</label>
                    <input type="text" id="full_name" name="full_name" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                
                <button type="submit" class="btn" onclick="handleRegister(event)">Register</button>
            </form>
            
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </div>

    <script>
        // Check if user is already logged in
        window.onload = function() {
            const currentUser = sessionStorage.getItem('currentUser');
            if (currentUser) {
                window.location.href = 'index.html';
            }
        };

        function checkPassword() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const passwordMatch = document.getElementById('passwordMatch');
            
            if (confirmPassword.value === '') {
                passwordMatch.textContent = '';
                return;
            }
            
            if (password === confirmPassword) {
                passwordMatch.textContent = 'Passwords match';
                passwordMatch.style.color = 'green';
            } else {
                passwordMatch.textContent = 'Passwords do not match';
                passwordMatch.style.color = 'red';
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const fullName = document.getElementById('full_name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            
            // Reset messages
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
            
            try {
                // Validate input
                if (!username || !email || !password || !confirmPassword || !fullName || !phone) {
                    showError("All fields are required");
                    return;
                }
                
                // Password validation
                if (password.length < 6) {
                    showError("Password must be at least 6 characters long");
                    return;
                }
                
                if (password !== confirmPassword) {
                    showError("Passwords do not match. Please check and try again.");
                    return;
                }
                
                // Email validation
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    showError("Please enter a valid email address");
                    return;
                }
                
                // Phone validation
                const phoneRegex = /^\d{10}$/;
                if (!phoneRegex.test(phone.replace(/\D/g, ''))) {
                    showError("Please enter a valid 10-digit phone number");
                    return;
                }
                
                // Get existing users or initialize empty array
                let users = JSON.parse(localStorage.getItem('users') || '[]');
                
                // Check if username or email already exists
                if (users.some(user => user.username === username)) {
                    showError("Username already exists");
                    return;
                }
                
                if (users.some(user => user.email === email)) {
                    showError("Email already registered");
                    return;
                }
                
                // Create new user object
                const newUser = {
                    id: Date.now(), // Unique ID
                    username,
                    email,
                    password: btoa(password), // Basic encoding (not secure, just for demo)
                    fullName,
                    phone,
                    membership: {
                        type: 'basic',
                        startDate: new Date().toISOString(),
                        endDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString(), // 30 days trial
                        status: 'active'
                    },
                    attendance: [],
                    payments: [],
                    createdAt: new Date().toISOString()
                };
                
                // Add new user to users array
                users.push(newUser);
                
                // Save to localStorage
                localStorage.setItem('users', JSON.stringify(users));
                
                // Create session for the new user
                sessionStorage.setItem('currentUser', JSON.stringify({
                    id: newUser.id,
                    username: newUser.username,
                    email: newUser.email,
                    fullName: newUser.fullName,
                    membership: newUser.membership
                }));
                
                showSuccess("Registration successful! Redirecting to login page...");
                
                // Redirect to login page after 2 seconds
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                showError("An error occurred. Please try again.");
                console.error('Registration error:', error);
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('success');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
    </script>

    <style>
        .password-match {
            font-size: 14px;
            margin-top: 5px;
            font-weight: 500;
        }
        .error {
            color: red;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid red;
            border-radius: 4px;
            background-color: #fff5f5;
        }
        .success {
            color: green;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid green;
            border-radius: 4px;
            background-color: #f0fff0;
        }
    </style>
</body>
</html>
