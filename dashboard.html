<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Healthy Wealthy Gym</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="dashboard-container">
            <h2><span id="welcomeMessage" style="color: #000000 !important; font-weight: 900 !important; -webkit-text-stroke: 1px black !important; text-shadow: 0 0 1px black !important;">Welcome, <span id="userName" style="color: #000000 !important; font-weight: 900 !important; -webkit-text-stroke: 1px black !important; text-shadow: 0 0 1px black !important;">User</span>!</span></h2>
            
            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3>Membership Status</h3>
                    <p id="membershipStatus">Loading...</p>
                </div>
                
                <div class="dashboard-card">
                    <h3>Attendance</h3>
                    <p id="attendance">Loading...</p>
                </div>
                
                <div class="dashboard-card">
                    <h3>Payment History</h3>
                    <p id="payments">Loading...</p>
                </div>
                
                <div class="dashboard-card">
                    <h3>Upcoming Classes</h3>
                    <p id="classes">Loading...</p>
                </div>
            </div>
            
            <div class="dashboard-actions">
                <button class="btn" onclick="location.href='index.html'">Home</button>
                <button class="btn" onclick="location.href='profile.html'">Profile</button>
                <button class="btn" onclick="location.href='schedule.html'">View Schedule</button>
                <button class="btn" onclick="location.href='lessons.html'">Lessons</button>
                <button class="btn" onclick="location.href='subscription.html'">Subscription Plans</button>
                <button class="btn" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in
        function checkAuth() {
            const currentUser = sessionStorage.getItem('currentUser');
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }
            
            const user = JSON.parse(currentUser);
            document.getElementById('userName').textContent = user.fullName || user.username;
            
            // Load mock data
            loadDashboardData();
        }
        
        function loadDashboardData() {
            // Mock data (in a real app, this would come from a backend)
            const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
            const membershipType = currentUser?.subscriptionPlan || 'Basic';
            
            document.getElementById('membershipStatus').textContent = `Active - ${membershipType.charAt(0).toUpperCase() + membershipType.slice(1)} Member`;
            document.getElementById('attendance').textContent = 'Last visit: Today';
            document.getElementById('payments').textContent = 'Next payment due: 15th of next month';
            document.getElementById('classes').textContent = 'Next class: Yoga - Tomorrow 10:00 AM';
        }
        
        function handleLogout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }
        
        // Check authentication when page loads
        window.onload = checkAuth;
    </script>

    <style>
        .dashboard-container {
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }
        
        #welcomeMessage {
            color: #000000 !important;
            font-weight: 900 !important;
            text-shadow: 0 0 1px black !important;
        }
        
        .dashboard-container h2 {
            color: #000000 !important;
            font-weight: 900 !important;
            margin-right: 15px;
            -webkit-text-stroke: 1px black !important;
            letter-spacing: 0.5px;
            text-shadow: 0 0 1px black !important;
        }
        
        #userName {
            color: #000000 !important;
            font-weight: 900 !important;
            font-size: 1.3em;
            -webkit-text-stroke: 1px black !important;
            letter-spacing: 0.5px;
            text-shadow: 0 0 1px black !important;
        }
        
        h2 span, h2 span#userName {
            color: #000000 !important;
            font-weight: 900 !important;
            -webkit-text-stroke: 1px black !important;
            text-shadow: 0 0 1px black !important;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .dashboard-card {
            background: var(--light-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .dashboard-card h3 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        
        .dashboard-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .dashboard-actions {
                flex-direction: column;
            }
            
            .dashboard-actions .btn {
                width: 100%;
            }
        }
    </style>
</body>
</html>
